# adapted from linuxkit
# CVE-1999-0511 posture: default IP forwarding OFF at boot so config-based
# scanners see the hardened default. k3s re-enables it at runtime via kubelet
# because kube-proxy and every CNI require net.ipv4.ip_forward=1 for pod
# networking; a node running k3s IS by design a router for pod traffic. Live
# scans of a running node will therefore still observe ip_forward=1, and that
# is the correct value while the node is serving pods.
net.ipv4.ip_forward = 0
# general limits
vm.max_map_count = 262144
vm.overcommit_memory = 1
net.core.somaxconn = 1024
net.ipv4.neigh.default.gc_thresh1 = 80000
net.ipv4.neigh.default.gc_thresh2 = 90000
net.ipv4.neigh.default.gc_thresh3 = 100000
fs.aio-max-nr = 1048576
fs.file-max = 1048576
# for rngd
kernel.random.write_wakeup_threshold = 3072
# security restrictions
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.perf_event_paranoid = 3
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
# Prevent ebpf privilege escalation
# see: https://lwn.net/Articles/742170
kernel.unprivileged_bpf_disabled=1
